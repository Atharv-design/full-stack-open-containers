services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    image: my-app-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always

  backend:
    image: my-app-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=3001
      - MONGO_URL=mongodb://root:example@mongo:27017/my_app_db
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: my_app_db
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
